<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Música</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="music-player">
        <div class = "info-tema">
            <h2 id="theme-title">Canción 1</h2>
            <img id="theme-image" src="cancion1.jpg" alt="Imagen de la canción">
            <p id="song-artist">Artista 1</p>
        </div>
     <audio id="audio-player" src ="cancion1.mp3"></audio>

     <div class="controls">
        <button id="prev-btn">&#9664;&#9664;</button>
            <button id="play-btn">&#9654;</button>
            <button id="next-btn">&#9654;&#9654;</button>
     </div>
     <div class="configuracion">
        <label for="volumen">Volumen:</label>
        
        <input type="range" id="volumen" min="0" max="1" step="0.01" value="1">
        
        <label for ="loop">
            <input type="checkbox" id="loop"> Repetir
        </label>

        <label for ="shuffle"> 
            <input type="checkbox" id="shuffle"> Aleatorio
        </label>
     </div>
     <input type="range" id="progress-bar" min="0" max="100" value="0">
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
